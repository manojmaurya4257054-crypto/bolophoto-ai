<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoloPhoto AI - Bina Key Video</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8E1] p-4">
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-4">
<h1 class="text-2xl font-bold text-center">BoloPhoto AI</h1>
<p class="text-center text-sm mb-4">Bina Key - Phone me hi Video Banao</p>
<div id="previewBox" class="w-full h-64 bg-gray-100 rounded-xl flex items-center justify-center overflow-hidden text-gray-400">Photo Preview</div>
<input type="file" id="photo" accept="image/*" class="mt-4 w-full">
<textarea id="text" class="w-full border rounded-xl p-3 mt-3" rows="3">Kya bataun yaar, meri biwi ne kaha tha ki meri kabr sukhne ke baad dusri shaadi kar lena. Par pata nahi kaun haramkhor roz paani daal deta hai!</textarea>
<button id="btn" onclick="makeVideo()" class="w-full mt-3 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold py-3 rounded-xl">✨ Video Banao - Bina Key</button>
<div id="result" class="hidden mt-4 p-3 bg-yellow-50 rounded-xl text-sm"></div>
<canvas id="myCanvas" width="512" height="512" class="hidden"></canvas>
</div>
<script>
let myImg = null;
const photoInput = document.getElementById('photo');
const previewBox = document.getElementById('previewBox');
photoInput.addEventListener('change', function() {
  if (!this.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    previewBox.innerHTML = "";
    const img = document.createElement('img');
    img.src = e.target.result;
    img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
    previewBox.appendChild(img);
    myImg = new Image();
    myImg.src = e.target.result;
  };
  reader.readAsDataURL(this.files[0]);
});
async function makeVideo(){
  if(!myImg){ alert('Pehle photo select karo!'); return; }
  const text = document.getElementById('text').value;
  const result = document.getElementById('result');
  result.classList.remove('hidden');
  result.innerText = 'Video Record ho raha hai... Photo bol rahi hai, awaaz suno, band mat karna!';
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');
  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, {mimeType: 'video/webm'});
  let chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, {type: 'video/webm'});
    const url = URL.createObjectURL(blob);
    result.innerHTML = '<video src="'+url+'" controls autoplay loop class="w-full rounded-xl"></video><p class="mt-2 font-bold text-green-600">Ho gaya! Video ban gaya!</p><a href="'+url+'" download="bolophoto-video.webm" class="block text-center bg-green-600 text-white py-2 rounded-xl mt-2 font-bold">Video Download Karo</a><p class="text-xs mt-2">Note: Ye video me photo hilegi. Awaaz ke liye isi text ko CapCut me Voiceover me daal do, 1 min ka kaam hai.</p>';
  };
  recorder.start();
  let startTime = Date.now();
  function draw(){
    let t = (Date.now() - startTime) / 1000;
    let zoom = 1 + Math.sin(t * 1.2) * 0.06;
    let shake = Math.sin(t * 8) * 2;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,512,512);
    let w = 512 * zoom, h = 512 * zoom;
    ctx.drawImage(myImg, (512-w)/2 + shake, (512-h)/2, w, h);
    if(recorder.state === 'recording') requestAnimationFrame(draw);
  }
  draw();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'hi-IN'; utter.rate = 0.95; utter.pitch = 0.9;
  utter.onend = () => { setTimeout(()=>{ if(recorder.state==='recording') recorder.stop(); }, 500); };
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
  setTimeout(()=>{ if(recorder.state==='recording') recorder.stop(); }, 25000);
}
</script>
</body>
</html>
