<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoloPhoto AI - Apni Photo Ko Banao Talking Video</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif;background:#FFFBEB} .gradient{background:linear-gradient(135deg,#ff6a00,#ee0979)}</style>
</head>
<body class="text-gray-900">
<header class="p-4 flex justify-between items-center max-w-6xl mx-auto">
<div class="font-bold text-xl">📸 BoloPhoto AI</div>
<a href="#pricing" class="bg-black text-white px-4 py-2 rounded-full text-sm">Pricing Dekho</a>
</header>
<section class="max-w-6xl mx-auto px-4 py-10 grid md:grid-cols-2 gap-8 items-center">
<div>
<h1 class="text-4xl md:text-5xl font-bold leading-tight">Apni Photo Ko Banao <span class="text-orange-600">Bolta Hua Video</span></h1>
<p class="mt-4 text-gray-600">Bas photo upload karo, text likho, 30 second me AI aapki photo ko bolta hua video bana dega.</p>
<div class="mt-6 flex gap-2 text-xs"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">✓ No Watermark</span><span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full">✓ Hindi + English</span></div>
</div>
<div class="bg-white rounded-2xl shadow-xl p-5 border">
<div id="previewBox" class="w-full h-48 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 mb-3 overflow-hidden">Photo Preview</div>
<input id="photo" type="file" accept="image/*" class="w-full text-sm mb-3">
<textarea id="text" placeholder="Jo bulwana hai likho... ex: Namaste dosto!" class="w-full border rounded-xl p-3 text-sm h-24"></textarea>
<button onclick="makeVideo()" id="btn" class="w-full mt-3 gradient text-white py-3 rounded-xl font-bold">✨ Free Video Banao - 0₹</button>
<div id="result" class="hidden mt-4 bg-black rounded-xl p-3 text-white text-sm text-center"></div>
</div>
</section>
<section id="pricing" class="max-w-6xl mx-auto px-4 py-8">
<h2 class="text-2xl font-bold text-center mb-6">Pricing - Paise Vasool</h2>
<div class="grid md:grid-cols-2 gap-4">
<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Starter - ₹399 / week</h3></div>
<div class="bg-black text-white p-6 rounded-2xl border-2 border-orange-500">
<h3 class="font-bold text-xl mb-4">Pro - ₹99 Only</h3>
<a href="https://rzp.io/rzp/EIUkUTK" target="_blank" style="display:block; width:100%; text-align:center; background:linear-gradient(to right, #ff6a00, #ee0979); color:white; padding:14px; border-radius:12px; font-weight:bold; text-decoration:none;">🚀 Pro Lo - ₹99 Pay Karo</a>
</div>


</section>
<script>
const DID_API_KEY = Z29vZ2xlLW9hdXRoMnwxMDA1NDc4NTcwMTYwNjU5NTc0ODNAYWtfbVVoSUFIb3VSYzN2NkxZQkptdWJI:tFyRbN0hcUG6Dh4vcNLQQ

const photo = document.getElementById('photo');
const previewBox = document.getElementById('previewBox');
photo.addEventListener('change', e => {
  const url = URL.createObjectURL(e.target.files[0]);
  previewBox.innerHTML = "";
  const img = document.createElement('img');
  img.src = url;
  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "cover";
  previewBox.appendChild(img);
});

async function makeVideo(){
  if(!photo.files[0]){ alert('Pehle photo select karo!'); return; }
  const text = document.getElementById('text').value || "Namaste dosto!";
  document.getElementById('btn').innerText = 'Video Ban Raha Hai...';
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').innerText = 'Video ban raha hai... 30 sec wait karo';

  try {
    // 1. Photo upload karo D-ID par
    const form = new FormData();
    form.append('image', photo.files[0]);
   const up = await fetch('https://corsproxy.io/?url=https%3A%2F%2Fapi.d-id.com%2Fimages', { 
      method: 'POST',
      headers: { 'Authorization': 'Basic ' + DID_API_KEY },
      body: form
    });
    const upData = await up.json();
    const imageUrl = upData.url;

    // 2. Video banao
    const talk = await fetch('https://corsproxy.io/?url=https%3A%2F%2Fapi.d-id.com%2Ftalks', {
      method: 'POST',
      headers: { 'Authorization': 'Basic ' + DID_API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_url: imageUrl,
        script: { type: 'text', input: text, provider: { type: 'microsoft', voice_id: 'hi-IN-SwaraNeural' } },
        config: { fluent: true, pad_audio: 0 }
      })
    });
    const talkData = await talk.json();
    const id = talkData.id;

    // 3. Video banne tak wait karo
    let videoUrl = "";
    for(let i=0; i<20; i++){
      await new Promise(r => setTimeout(r, 3000));
      const check = await fetch('https://api.d-id.com/talks/' + id, {
        headers: { 'Authorization': 'Basic ' + DID_API_KEY }
      });
      const cData = await check.json();
      if(cData.result_url){ videoUrl = cData.result_url; break; }
    }

    if(videoUrl){
      document.getElementById('result').innerHTML = `<video src="${videoUrl}" controls autoplay class="w-full rounded-xl"></video><p class="mt-2">Ho gaya! Aapka Real Video ban gaya!</p>`;
    } else {
      document.getElementById('result').innerText = 'Time zyada lag raha hai, thodi der baad phir try karo';
    }
  } catch(e){
    document.getElementById('result').innerText = 'Error: Key galat hai ya net slow hai. Key check karo!';
  }
  document.getElementById('btn').innerText = 'Free Video Banao';
}
                             </script>
</body>
 </html>
